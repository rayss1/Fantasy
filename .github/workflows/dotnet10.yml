name: .NET 10 validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.202

      - name: Restore tooling
        run: dotnet restore Fantasy.sln

      - name: Restore server
        run: dotnet restore examples/Server/Server.sln

      - name: Build tooling
        run: dotnet build Fantasy.sln --configuration Release --no-restore --warnaserror

      - name: Build server
        run: dotnet build examples/Server/Server.sln --configuration Release --no-restore --warnaserror

      - name: Run package and config regressions
        run: dotnet test Fantasy.Packages/Fantasy.Net.Tests/Fantasy.Net.Tests.csproj --configuration Release --no-build --no-restore

      - name: Publish and smoke test runtimes
        shell: pwsh
        run: ./.github/scripts/Validate-Runtime.ps1

      - name: Validate graceful SIGTERM shutdown
        if: runner.os == 'Linux'
        shell: bash
        run: ./.github/scripts/Validate-GracefulShutdown.sh

      - name: Audit dependencies
        shell: pwsh
        run: ./.github/scripts/Test-Dependencies.ps1
